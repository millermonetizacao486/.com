<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#18191a" />
<title>Miller Monetização — Recompensas</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --fb-bg:#18191a; --fb-card:#242526; --fb-elevated:#3a3b3c;
  --fb-hover:#4a4b4d; --fb-border:#3e4042;
  --fb-text:#e4e6eb; --fb-text-secondary:#b0b3b8;
  --fb-blue:#1877f2; --fb-blue-hover:#166fe5; --fb-blue-light:#2d88ff;
  --fb-green:#31a24c; --fb-gold:#f7b928; --fb-red:#fa383e;
  --fb-orange:#f59e0b; --fb-purple:#a855f7; --fb-cyan:#06b6d4;
  --gray:#9ca3af;
  --green:#31a24c; --orange:#f59e0b; --purple:#a855f7; --cyan:#06b6d4; --red:#fa383e;
  --radius:10px; --radius-lg:14px;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  --transition:.22s cubic-bezier(.4,0,.2,1);
  --grad-blue:linear-gradient(135deg,#1877f2 0%,#2d88ff 100%);
  --grad-gold:linear-gradient(135deg,#f7b928 0%,#f59e0b 55%,#f7b928 100%);
  --grad-wallet:linear-gradient(135deg,#1e2a44 0%,#16213a 55%,#101a2e 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  background:var(--fb-bg); color:var(--fb-text);
  min-height:100vh; display:flex; flex-direction:column;
  padding-bottom:80px; overflow-x:hidden; font-size:15px;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
::selection{background:rgba(24,119,242,.35);color:#fff}

/* ============ LOADING ============ */
#loading-overlay{
  position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1f2c47 0%,#18191a 70%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;
  transition:opacity .5s ease,visibility .5s;
}
#loading-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.fb-loader-logo{
  width:72px;height:72px;border-radius:50%;background:var(--grad-blue);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:46px;font-weight:900;font-family:'Inter',sans-serif;line-height:1;
  padding-bottom:4px;box-shadow:0 10px 32px rgba(24,119,242,.5);
  animation:fbLogoPulse 1.8s ease-in-out infinite;position:relative;
}
.fb-loader-logo::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:2px solid rgba(24,119,242,.4);animation:fbLogoRing 1.8s ease-out infinite;
}
@keyframes fbLogoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fbLogoRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.fb-dots-loader{display:flex;align-items:center;gap:11px;margin-top:28px;height:20px}
.fb-dot{
  width:14px;height:14px;border-radius:50%;background:var(--fb-blue);
  opacity:.25;animation:fbDotBounce 1.4s ease-in-out infinite;
}
.fb-dot:nth-child(2){animation-delay:.2s}
.fb-dot:nth-child(3){animation-delay:.4s}
@keyframes fbDotBounce{
  0%,80%,100%{transform:scale(.7) translateY(0);opacity:.25}
  40%{transform:scale(1.15) translateY(-6px);opacity:1;box-shadow:0 6px 18px rgba(24,119,242,.55)}
}
.fb-loader-brand{margin-top:24px;font-weight:800;font-size:1.2rem;letter-spacing:-.3px;color:var(--fb-text)}
.fb-loader-sub{
  margin-top:6px;font-size:.72rem;color:var(--fb-text-secondary);
  letter-spacing:2.5px;text-transform:uppercase;animation:fbPulseText 1.6s ease-in-out infinite;
}
@keyframes fbPulseText{0%,100%{opacity:.45}50%{opacity:1}}

/* ============ HEADER ============ */
.fb-header{
  position:sticky;top:0;z-index:100;background:rgba(36,37,38,.92);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--fb-border);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:var(--shadow);animation:headerSlideDown .5s cubic-bezier(.4,0,.2,1);
}
@keyframes headerSlideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.fb-logo{display:flex;align-items:center;gap:11px;flex-shrink:0;min-width:0}
.fb-logo-mark{
  width:42px;height:42px;border-radius:50%;background:var(--grad-blue);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:27px;font-weight:900;font-family:'Inter',sans-serif;line-height:1;
  padding-bottom:3px;box-shadow:0 3px 12px rgba(24,119,242,.4);flex-shrink:0;
  transition:transform var(--transition),box-shadow var(--transition);cursor:pointer;
}
.fb-logo-mark:hover{transform:scale(1.08) rotate(-6deg);box-shadow:0 6px 22px rgba(24,119,242,.65)}
.fb-logo-mark:active{transform:scale(.94) rotate(0)}
.fb-logo-text{font-weight:800;font-size:1.05rem;letter-spacing:-.3px;line-height:1;min-width:0}
.fb-logo-text small{
  display:flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;
  color:var(--fb-blue-light);letter-spacing:.4px;margin-top:4px;white-space:nowrap;
}
.fb-logo-text small i{
  font-size:.62rem;color:var(--fb-gold);animation:giftShake 3s ease-in-out infinite;
  transform-origin:center bottom;display:inline-block;
}
@keyframes giftShake{
  0%,85%,100%{transform:rotate(0)}
  88%{transform:rotate(-12deg) scale(1.15)}
  91%{transform:rotate(10deg) scale(1.15)}
  94%{transform:rotate(-8deg) scale(1.1)}
  97%{transform:rotate(0)}
}
.fb-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fb-icon-btn{
  width:42px;height:42px;border-radius:50%;background:var(--fb-elevated);
  border:none;color:var(--fb-text);font-size:1.05rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--transition),transform var(--transition);position:relative;
}
.fb-icon-btn:hover{background:var(--fb-hover);transform:scale(1.06)}
.fb-icon-btn:active{transform:scale(.92)}
.fb-icon-btn:hover i{animation:bellWiggle .6s ease-in-out}
@keyframes bellWiggle{
  0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}
  40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}
}
.fb-icon-btn .badge{
  position:absolute;top:1px;right:1px;background:var(--fb-red);color:#fff;
  font-size:.6rem;font-weight:800;min-width:19px;height:19px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
  border:2.5px solid var(--fb-card);transition:all .3s;line-height:1;
}
.fb-icon-btn .badge.new{animation:badgePulse 1.5s ease-in-out infinite}
.fb-icon-btn .badge.hidden{display:none}
@keyframes badgePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(250,56,62,.7);transform:scale(1)}
  50%{box-shadow:0 0 0 6px rgba(250,56,62,0);transform:scale(1.12)}
}

/* ============ WALLET ============ */
.wallet-bar{
  background:var(--grad-wallet);background-size:200% 200%;
  border-bottom:1px solid var(--fb-border);padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  position:sticky;top:63px;z-index:99;overflow:hidden;
  animation:headerSlideDown .6s cubic-bezier(.4,0,.2,1) .1s backwards,walletGradient 9s ease infinite;
}
@keyframes walletGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.wallet-bar::before{
  content:'';position:absolute;top:-50%;right:-10%;width:280px;height:280px;
  background:radial-gradient(circle,rgba(24,119,242,.22) 0%,transparent 65%);
  pointer-events:none;
}
.wallet-info{display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.wallet-avatar{
  width:52px;height:52px;border-radius:50%;background:var(--grad-blue);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;
  position:relative;box-shadow:0 6px 18px rgba(24,119,242,.5);
  transition:transform var(--transition);
}
.wallet-avatar:hover{transform:scale(1.08) rotate(6deg)}
.wallet-avatar::after{
  content:'';position:absolute;bottom:1px;right:1px;width:14px;height:14px;
  border-radius:50%;background:var(--fb-green);border:2.5px solid #101a2e;
  animation:onlinePulse 2s ease-in-out infinite;
}
@keyframes onlinePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(49,162,76,.7)}
  50%{box-shadow:0 0 0 6px rgba(49,162,76,0)}
}
.wallet-text .label{
  font-size:.68rem;color:var(--fb-text-secondary);text-transform:uppercase;
  letter-spacing:1.2px;font-weight:700;display:flex;align-items:center;gap:6px;
}
.wallet-text .label i{color:var(--fb-green);font-size:.55rem}
.wallet-text .amount{
  font-size:1.7rem;font-weight:900;color:#fff;line-height:1.15;
  transition:transform .3s,color .3s;display:inline-block;letter-spacing:-.5px;
  text-shadow:0 2px 12px rgba(24,119,242,.3);
}
.wallet-text .amount.flash{animation:amountFlash .8s ease-out}
@keyframes amountFlash{
  0%{transform:scale(1);color:#fff}
  30%{transform:scale(1.2);color:var(--fb-gold);text-shadow:0 0 24px rgba(247,185,40,.9)}
  100%{transform:scale(1);color:#fff}
}
.wallet-text .amount .currency{font-size:.9rem;color:var(--fb-text-secondary);margin-left:5px;font-weight:700}
.wallet-pending{
  font-size:.7rem;color:var(--fb-orange);margin-top:4px;
  display:flex;align-items:center;gap:6px;font-weight:700;
}
.wallet-pending i{animation:hourglassSpin 3s ease-in-out infinite}
@keyframes hourglassSpin{
  0%,100%{transform:rotate(0)}45%{transform:rotate(180deg)}55%{transform:rotate(180deg)}
}
.withdraw-btn-fb{
  display:inline-flex;align-items:center;gap:8px;background:var(--grad-blue);
  color:#fff;padding:11px 24px;border-radius:10px;border:none;font-family:inherit;
  font-size:.9rem;font-weight:800;cursor:pointer;transition:all var(--transition);
  box-shadow:0 4px 14px rgba(24,119,242,.4);position:relative;overflow:hidden;
  position:relative;z-index:1;letter-spacing:.2px;
}
.withdraw-btn-fb::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-100%);transition:transform .7s;
}
.withdraw-btn-fb:hover::before{transform:translateX(100%)}
.withdraw-btn-fb:hover{background:var(--fb-blue-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(24,119,242,.6)}
.withdraw-btn-fb:active{transform:translateY(0) scale(.97)}
.withdraw-btn-fb i{transition:transform .3s}
.withdraw-btn-fb:hover i{transform:translateY(-3px)}

/* ============ CHIPS ============ */
.chips-bar{
  display:flex;gap:8px;padding:14px 20px;overflow-x:auto;scrollbar-width:none;
  background:var(--fb-bg);border-bottom:1px solid var(--fb-border);
}
.chips-bar::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:9px 17px;background:var(--fb-elevated);color:var(--fb-text);
  border-radius:22px;font-size:.85rem;font-weight:700;cursor:pointer;
  transition:all var(--transition);display:flex;align-items:center;gap:8px;
  border:1px solid transparent;
  animation:chipPop .4s cubic-bezier(.34,1.56,.64,1) backwards;
}
.chip:nth-child(1){animation-delay:.05s}
.chip:nth-child(2){animation-delay:.12s}
@keyframes chipPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.chip:hover{background:var(--fb-hover);transform:translateY(-2px)}
.chip:active{transform:scale(.95)}
.chip.active{
  background:var(--grad-blue);color:#fff;border-color:var(--fb-blue);
  box-shadow:0 4px 16px rgba(24,119,242,.45);
}
.chip i{transition:transform .3s}
.chip:hover i{transform:rotate(12deg) scale(1.15)}

/* ============ GRID ============ */
.content-area{padding:20px;max-width:1600px;margin:0 auto;width:100%}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px 18px}
.video-card{
  cursor:pointer;background:var(--fb-card);border-radius:var(--radius-lg);
  overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow);
  border:1px solid var(--fb-border);
  animation:cardEnter .6s cubic-bezier(.34,1.2,.64,1) backwards;
}
@keyframes cardEnter{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.video-card:hover{
  transform:translateY(-6px) scale(1.01);
  box-shadow:0 22px 46px rgba(0,0,0,.55),0 0 0 1px rgba(24,119,242,.55);
  border-color:rgba(24,119,242,.55);
}
.video-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#1c1d1e}
.video-thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .65s cubic-bezier(.4,0,.2,1);
}
.video-card:hover .video-thumb img{transform:scale(1.1) rotate(.5deg)}
.video-platform{
  position:absolute;top:10px;left:10px;color:#fff;padding:6px 12px;border-radius:8px;
  font-size:.7rem;font-weight:800;display:flex;align-items:center;gap:6px;
  background:var(--grad-blue);box-shadow:0 3px 10px rgba(0,0,0,.4);
  letter-spacing:.4px;transition:transform var(--transition);
}
.video-card:hover .video-platform{transform:scale(1.05)}
.video-platform i{animation:fbIconSpin 4s linear infinite}
@keyframes fbIconSpin{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(360deg)}}
.reward-tag{
  position:absolute;top:10px;right:10px;
  background:var(--grad-gold);background-size:200% 200%;color:#1a1a1a;
  padding:6px 12px;border-radius:22px;font-size:.72rem;font-weight:900;
  display:flex;align-items:center;gap:5px;letter-spacing:.3px;
  box-shadow:0 3px 12px rgba(247,185,40,.55);
  animation:goldPulse 2s ease-in-out infinite,goldShimmer 3s ease-in-out infinite;
}
@keyframes goldPulse{
  0%,100%{box-shadow:0 3px 12px rgba(247,185,40,.55)}
  50%{box-shadow:0 3px 20px rgba(247,185,40,.95)}
}
@keyframes goldShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.reward-tag i{animation:coinFlip 3s ease-in-out infinite}
@keyframes coinFlip{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(180deg)}}
.reward-tag.pending{
  background:linear-gradient(135deg,var(--fb-orange),#d97706);color:#fff;
  animation:pendingPulse 1.5s ease-in-out infinite;
}
@keyframes pendingPulse{
  0%,100%{box-shadow:0 3px 12px rgba(245,158,11,.55)}
  50%{box-shadow:0 3px 20px rgba(245,158,11,.95)}
}
.reward-tag.cooldown{
  background:linear-gradient(135deg,#4b5563,#374151);color:#e5e7eb;
  animation:none;font-family:'SFMono-Regular',Consolas,'Courier New',monospace;
  letter-spacing:.5px;font-weight:700;
}
.video-overlay-actions{
  position:absolute;inset:0;background:rgba(0,0,0,.58);
  display:flex;align-items:center;justify-content:center;opacity:0;
  transition:opacity var(--transition);pointer-events:none;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.video-card:hover .video-overlay-actions{opacity:1;pointer-events:auto}
.action-pulse-btn{
  background:var(--grad-blue);color:#fff;border:none;padding:13px 28px;
  border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:800;
  cursor:pointer;display:flex;align-items:center;gap:9px;
  transition:all var(--transition);box-shadow:0 5px 18px rgba(24,119,242,.5);
  transform:translateY(10px);letter-spacing:.2px;
}
.video-card:hover .action-pulse-btn{transform:translateY(0)}
.action-pulse-btn:hover{
  background:var(--fb-blue-hover);transform:scale(1.08) translateY(0);
  box-shadow:0 8px 24px rgba(24,119,242,.65);
}
.action-pulse-btn:active{transform:scale(.95) translateY(0)}
.action-pulse-btn:disabled{
  background:#4b5563;cursor:not-allowed;opacity:.9;box-shadow:none;transform:translateY(0);
}
.video-info{display:flex;gap:12px;padding:13px 15px 15px}
.video-avatar{
  flex-shrink:0;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:#fff;
  background:var(--grad-blue);box-shadow:0 3px 10px rgba(24,119,242,.35);
  transition:transform .3s;
}
.video-card:hover .video-avatar{transform:scale(1.1);box-shadow:0 5px 16px rgba(24,119,242,.55)}
.video-meta{flex:1;min-width:0}
.video-title{
  font-size:.92rem;font-weight:600;line-height:1.4;margin-bottom:5px;
  color:var(--fb-text);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.video-channel{
  font-size:.78rem;color:var(--fb-text-secondary);font-weight:500;
  display:flex;align-items:center;gap:5px;
}
.verified{color:var(--fb-blue);font-size:.75rem}

/* ============ EMPTY STATE ============ */
@keyframes emptyStateIn{
  from{opacity:0;transform:translateY(24px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes emptyIconFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-10px) rotate(-3deg)}
}
.empty-state-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:70px 24px;min-height:55vh;
  animation:emptyStateIn .7s cubic-bezier(.34,1.2,.64,1);
}
.empty-state-icon{
  width:110px;height:110px;border-radius:50%;
  background:linear-gradient(135deg,rgba(24,119,242,.18),rgba(45,136,255,.08));
  border:2px dashed rgba(24,119,242,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;color:var(--fb-blue-light);margin-bottom:28px;
  animation:emptyIconFloat 3s ease-in-out infinite;
  box-shadow:0 0 60px rgba(24,119,242,.25);
}
.empty-state-title{
  font-size:1.5rem;font-weight:900;color:var(--fb-text);
  margin-bottom:12px;letter-spacing:-.4px;line-height:1.25;
  max-width:520px;
}
.empty-state-desc{
  font-size:.95rem;color:var(--fb-text-secondary);
  line-height:1.6;max-width:440px;margin-bottom:28px;
}
.empty-state-actions{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.empty-state-btn{
  display:inline-flex;align-items:center;gap:9px;
  border:none;padding:13px 26px;border-radius:10px;
  font-family:inherit;font-size:.9rem;font-weight:800;cursor:pointer;
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
.empty-state-btn.primary{
  background:var(--grad-blue);color:#fff;
  box-shadow:0 5px 18px rgba(24,119,242,.45);
}
.empty-state-btn.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(24,119,242,.65);
  background:var(--fb-blue-hover);
}
.empty-state-btn.secondary{
  background:var(--fb-elevated);color:var(--fb-text);
  border:1px solid var(--fb-border);
}
.empty-state-btn.secondary:hover{
  background:var(--fb-hover);transform:translateY(-2px);
}
.empty-state-btn:active{transform:translateY(0) scale(.97)}
.empty-state-note{
  margin-top:40px;padding:16px 22px;border-radius:12px;
  background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);
  display:inline-flex;align-items:center;gap:11px;
  font-size:.82rem;color:var(--fb-orange);font-weight:700;
  max-width:460px;text-align:left;
}
.empty-state-note i{font-size:1.05rem;flex-shrink:0}
.empty-filter-result{
  grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--fb-text-secondary);
}
.empty-filter-result i{
  font-size:2.5rem;opacity:.4;margin-bottom:16px;display:block;
}
.empty-filter-result h4{
  font-weight:800;color:var(--fb-text);margin-bottom:6px;
}
.empty-filter-result p{font-size:.85rem}

/* ============ HISTORY PANEL ============ */
.history-panel{
  position:fixed;top:0;right:0;bottom:0;width:100%;max-width:490px;
  background:var(--fb-card);border-left:1px solid var(--fb-border);z-index:9997;
  transform:translateX(100%);transition:transform .42s cubic-bezier(.34,1.2,.64,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 48px rgba(0,0,0,.55);
}
.history-panel.open{transform:translateX(0)}
.history-header{
  padding:18px 20px;border-bottom:1px solid var(--fb-border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--fb-card);position:sticky;top:0;z-index:10;
}
.history-header h3{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:11px}
.history-header h3 .icon-circle{
  width:38px;height:38px;border-radius:50%;background:var(--grad-blue);
  display:flex;align-items:center;justify-content:center;font-size:.95rem;color:#fff;
  transition:transform .3s;box-shadow:0 3px 12px rgba(24,119,242,.4);
}
.history-header h3 .icon-circle:hover{transform:rotate(360deg) scale(1.1)}
.history-close{
  background:var(--fb-elevated);border:none;color:var(--fb-text);font-size:1rem;
  cursor:pointer;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--transition),transform var(--transition);
}
.history-close:hover{background:var(--fb-hover);transform:rotate(90deg) scale(1.1)}
.history-close:active{transform:rotate(90deg) scale(.9)}
.history-summary{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:14px 16px;background:var(--fb-bg);border-bottom:1px solid var(--fb-border);
}
.summary-card{
  background:var(--fb-card);border:1px solid var(--fb-border);border-radius:12px;
  padding:11px 6px;text-align:center;transition:all var(--transition);
  animation:cardEnter .5s cubic-bezier(.34,1.2,.64,1) backwards;
}
.summary-card:nth-child(1){animation-delay:.05s}
.summary-card:nth-child(2){animation-delay:.1s}
.summary-card:nth-child(3){animation-delay:.15s}
.summary-card:nth-child(4){animation-delay:.2s}
.summary-card:hover{transform:translateY(-3px);border-color:var(--fb-blue);box-shadow:0 5px 16px rgba(24,119,242,.25)}
.summary-card .num{font-size:1.05rem;font-weight:900;line-height:1;color:var(--fb-gold)}
.summary-card .num.green{color:var(--fb-green)}
.summary-card .num.orange{color:var(--fb-orange)}
.summary-card .num.red{color:var(--fb-red)}
.summary-card .lbl{
  font-size:.58rem;color:var(--fb-text-secondary);text-transform:uppercase;
  letter-spacing:.4px;margin-top:5px;font-weight:700;
}
.history-filters{
  display:flex;padding:13px 16px;gap:8px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--fb-border);background:var(--fb-card);
}
.history-filters::-webkit-scrollbar{display:none}
.hist-filter{
  flex-shrink:0;padding:8px 14px;background:var(--fb-elevated);border:1px solid transparent;
  border-radius:22px;color:var(--fb-text);font-family:inherit;font-size:.75rem;
  font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:all var(--transition);
}
.hist-filter:hover{background:var(--fb-hover);transform:translateY(-2px)}
.hist-filter:active{transform:scale(.95)}
.hist-filter.active{background:var(--grad-blue);color:#fff;border-color:var(--fb-blue);box-shadow:0 4px 16px rgba(24,119,242,.45)}
.hist-filter .count{
  background:rgba(255,255,255,.15);padding:1px 7px;border-radius:10px;
  font-size:.62rem;font-weight:800;transition:transform .3s;
}
.hist-filter:hover .count{transform:scale(1.15)}
.hist-filter.active .count{background:rgba(255,255,255,.28)}
.history-body{flex:1;overflow-y:auto;padding:14px 16px 40px;scrollbar-width:thin}
.history-body::-webkit-scrollbar{width:6px}
.history-body::-webkit-scrollbar-thumb{background:var(--fb-border);border-radius:3px}
.history-body::-webkit-scrollbar-thumb:hover{background:#555}
.history-empty{text-align:center;padding:60px 20px;color:var(--fb-text-secondary)}
.history-empty i{
  font-size:3rem;opacity:.35;margin-bottom:18px;display:block;color:var(--fb-blue);
  animation:emptyBob 2.5s ease-in-out infinite;
}
@keyframes emptyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.history-empty h4{font-size:1rem;font-weight:800;margin-bottom:6px;color:var(--fb-text)}
.history-empty p{font-size:.82rem;line-height:1.5}
.history-item{
  display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--fb-bg);
  border:1px solid var(--fb-border);margin-bottom:10px;transition:all var(--transition);
  animation:historySlideIn .5s cubic-bezier(.34,1.2,.64,1) backwards;
}
@keyframes historySlideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.history-item:hover{
  background:#1c1d1e;border-color:var(--fb-blue);transform:translateX(-4px);
  box-shadow:-4px 0 0 var(--fb-blue),0 4px 14px rgba(0,0,0,.3);
}
.history-item-icon{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.1rem;color:#fff;flex-shrink:0;
  background:var(--grad-blue);transition:transform .3s;
}
.history-item:hover .history-item-icon{transform:scale(1.1) rotate(8deg)}
.history-item-content{flex:1;min-width:0}
.history-item-title{
  font-size:.85rem;font-weight:600;color:var(--fb-text);margin-bottom:6px;
  line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.history-item-meta{
  font-size:.68rem;color:var(--fb-text-secondary);display:flex;flex-wrap:wrap;
  gap:6px;align-items:center;margin-bottom:7px;
}
.history-item-meta .date-badge{
  display:inline-flex;align-items:center;gap:4px;background:var(--fb-elevated);
  padding:3px 9px;border-radius:7px;font-weight:600;
}
.history-item-amount{display:flex;align-items:center;justify-content:space-between;gap:8px}
.history-item-amount .value{font-weight:900;font-size:.95rem;letter-spacing:-.2px}
.value.green{color:var(--fb-green)}
.value.orange{color:var(--fb-orange)}
.value.red{color:var(--fb-red)}
.value.gray{color:var(--gray)}
.value.purple{color:var(--fb-purple)}
.value.cyan{color:var(--fb-cyan)}
.history-item-status{
  display:inline-flex;align-items:center;gap:5px;font-size:.64rem;font-weight:800;
  padding:5px 10px;border-radius:14px;text-transform:uppercase;letter-spacing:.4px;
}
.status-claimed{background:rgba(49,162,76,.18);color:var(--fb-green)}
.status-pending{background:rgba(245,158,11,.18);color:var(--fb-orange)}
.status-cooldown{background:rgba(107,114,128,.22);color:var(--gray)}
.status-blocked{background:rgba(168,85,247,.18);color:var(--fb-purple)}
.status-withdraw{background:rgba(6,182,212,.18);color:var(--fb-cyan)}
.status-info{background:rgba(24,119,242,.18);color:var(--fb-blue-light)}
.pending-timer{
  font-size:.68rem;color:var(--fb-orange);margin-top:6px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;
  font-family:'SFMono-Regular',Consolas,'Courier New',monospace;
  background:rgba(245,158,11,.1);padding:5px 9px;border-radius:8px;
}
.pending-timer i{animation:hourglassSpin 3s ease-in-out infinite}
.history-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9996;
  opacity:0;visibility:hidden;transition:all .3s;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.history-backdrop.open{opacity:1;visibility:visible}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9998;
  display:none;justify-content:center;align-items:center;padding:20px;
}
.modal-overlay.active{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{
  background:var(--fb-card);border-radius:16px;padding:26px;max-width:520px;
  width:100%;border:1px solid var(--fb-border);max-height:90vh;overflow-y:auto;
  animation:modalBounceIn .5s cubic-bezier(.34,1.4,.64,1);box-shadow:var(--shadow-lg);
}
@keyframes modalBounceIn{
  0%{opacity:0;transform:translateY(40px) scale(.9)}
  60%{transform:translateY(-8px) scale(1.02)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;
  padding-bottom:16px;border-bottom:1px solid var(--fb-border);
}
.modal-header h2{font-size:1.2rem;font-weight:900;display:flex;align-items:center;gap:11px}
.modal-header h2 .icon-circle{
  width:40px;height:40px;border-radius:50%;background:var(--grad-blue);
  display:flex;align-items:center;justify-content:center;font-size:.98rem;color:#fff;
  animation:iconPop .6s cubic-bezier(.34,1.56,.64,1) .2s backwards;
  box-shadow:0 4px 12px rgba(24,119,242,.4);
}
@keyframes iconPop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.modal-close{
  background:var(--fb-elevated);border:none;color:var(--fb-text);font-size:1rem;
  cursor:pointer;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--transition),transform var(--transition);
}
.modal-close:hover{background:var(--fb-hover);transform:rotate(90deg) scale(1.1)}
.form-group{margin-bottom:15px}
.form-group label{
  display:block;font-size:.72rem;font-weight:800;color:var(--fb-text-secondary);
  margin-bottom:7px;letter-spacing:.6px;text-transform:uppercase;
}
.form-group label .required{color:var(--fb-red);margin-left:3px}
.form-group input,.form-group select{
  width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--fb-border);
  background:var(--fb-bg);color:var(--fb-text);font-family:inherit;font-size:.92rem;
  outline:none;transition:all var(--transition);
}
.form-group input:focus,.form-group select:focus{
  border-color:var(--fb-blue);box-shadow:0 0 0 3px rgba(24,119,242,.2);transform:translateY(-1px);
}
.form-group select option{background:var(--fb-card);color:var(--fb-text)}
.withdraw-amount-box{
  background:linear-gradient(135deg,rgba(247,185,40,.12),rgba(245,158,11,.06),rgba(247,185,40,.12));
  background-size:200% 200%;border:1px solid rgba(247,185,40,.4);
  padding:18px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  gap:11px;font-size:1.55rem;font-weight:900;color:var(--fb-gold);
  animation:goldShimmer 4s ease-in-out infinite;letter-spacing:-.5px;
}
.withdraw-amount-box i{animation:coinSpin 2s ease-in-out infinite}
@keyframes coinSpin{0%,100%{transform:rotate(0)}50%{transform:rotate(360deg)}}
.withdraw-amount-box .currency{font-size:.9rem;color:var(--fb-text-secondary);font-weight:700}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{
  display:flex;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--fb-border);
}
.btn-cancel{
  flex:1;padding:13px;border-radius:10px;border:1px solid var(--fb-border);
  background:var(--fb-elevated);color:var(--fb-text);font-family:inherit;font-weight:800;
  cursor:pointer;font-size:.92rem;transition:all var(--transition);
}
.btn-cancel:hover{background:var(--fb-hover);transform:translateY(-2px)}
.btn-cancel:active{transform:scale(.97)}
.btn-submit{
  flex:2;padding:13px;border-radius:10px;border:none;background:var(--grad-blue);
  color:#fff;font-family:inherit;font-weight:800;cursor:pointer;font-size:.95rem;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:all var(--transition);box-shadow:0 4px 14px rgba(24,119,242,.4);
  position:relative;overflow:hidden;letter-spacing:.2px;
}
.btn-submit::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-100%);transition:transform .7s;
}
.btn-submit:hover::before{transform:translateX(100%)}
.btn-submit:hover{background:var(--fb-blue-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(24,119,242,.6)}
.btn-submit:active{transform:scale(.97)}

/* ============ FLOAT ASSIST ============ */
.float-assist{
  position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;
  gap:10px;z-index:1000;align-items:flex-end;
}
.assist-btn{
  width:50px;height:50px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:20px;text-decoration:none;
  position:relative;box-shadow:0 5px 16px rgba(0,0,0,.45);transition:all var(--transition);
  animation:assistIn .4s cubic-bezier(.34,1.56,.64,1) backwards;
}
.assist-group.open .assist-btn:nth-child(1){animation-delay:.05s}
.assist-group.open .assist-btn:nth-child(2){animation-delay:.1s}
.assist-group.open .assist-btn:nth-child(3){animation-delay:.15s}
@keyframes assistIn{from{opacity:0;transform:translateX(30px) scale(.5)}to{opacity:1;transform:translateX(0) scale(1)}}
.assist-btn.whatsapp{background:linear-gradient(135deg,#25d366,#128c7e)}
.assist-btn.call{background:var(--grad-blue)}
.assist-btn.sms{background:linear-gradient(135deg,#f59e0b,#d97706)}
.assist-btn:hover{transform:scale(1.15) rotate(-8deg);box-shadow:0 10px 28px rgba(0,0,0,.65)}
.assist-btn:active{transform:scale(.95)}
.assist-btn .tooltip{
  position:absolute;right:62px;background:var(--fb-card);color:var(--fb-text);
  padding:7px 15px;border-radius:22px;font-size:.72rem;font-weight:700;
  white-space:nowrap;opacity:0;pointer-events:none;transition:all var(--transition);
  border:1px solid var(--fb-border);box-shadow:var(--shadow);
}
.assist-btn:hover .tooltip{opacity:1;right:58px}
.assist-toggle{
  width:58px;height:58px;border-radius:50%;background:var(--grad-blue);color:#fff;
  border:none;font-size:23px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;box-shadow:0 8px 24px rgba(24,119,242,.55);
  transition:all var(--transition);animation:pulseRing 2.5s ease-in-out infinite;
}
@keyframes pulseRing{
  0%,100%{box-shadow:0 8px 24px rgba(24,119,242,.55),0 0 0 0 rgba(24,119,242,.65)}
  50%{box-shadow:0 8px 24px rgba(24,119,242,.55),0 0 0 14px rgba(24,119,242,0)}
}
.assist-toggle:hover{transform:rotate(90deg) scale(1.08);background:var(--fb-blue-hover)}
.assist-toggle:active{transform:rotate(90deg) scale(.95)}
.assist-group{
  display:flex;flex-direction:column;gap:10px;max-height:0;opacity:0;overflow:hidden;
  transition:max-height .4s cubic-bezier(.34,1.2,.64,1),opacity .35s ease;
}
.assist-group.open{max-height:300px;opacity:1}

/* ============ TOAST ============ */
.mg-toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(40px) scale(.9);
  background:var(--fb-card);color:var(--fb-text);padding:14px 26px;border-radius:12px;
  font-weight:700;font-size:.88rem;border:1px solid var(--fb-border);z-index:9999;
  opacity:0;transition:all .4s cubic-bezier(.34,1.4,.64,1);display:flex;
  align-items:center;gap:11px;max-width:90vw;box-shadow:var(--shadow-lg);
}
.mg-toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.mg-toast i{animation:iconPop .5s cubic-bezier(.34,1.56,.64,1) .1s backwards}
.mg-toast.success{border-color:rgba(49,162,76,.6);color:var(--fb-green)}
.mg-toast.error{border-color:rgba(250,56,62,.6);color:var(--fb-red)}
.mg-toast.info{border-color:rgba(24,119,242,.6);color:var(--fb-blue-light)}
.mg-toast.pending{border-color:rgba(245,158,11,.6);color:var(--fb-orange)}

/* ============ RIPPLE ============ */
.ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.5);
  transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

/* ============ RESPONSIVE ============ */
@media (max-width:900px){
  .fb-header{padding:9px 12px}
  .wallet-bar{padding:14px;top:63px}
  .content-area{padding:14px}
  .video-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
@media (max-width:600px){
  body{padding-bottom:70px}
  .content-area{padding:12px}
  .video-grid{grid-template-columns:1fr;gap:16px}
  .modal-content{padding:20px 16px}
  .form-row{grid-template-columns:1fr}
  .history-panel{max-width:100%}
  .history-summary{grid-template-columns:repeat(4,1fr);padding:10px}
  .summary-card .num{font-size:.85rem}
  .summary-card .lbl{font-size:.5rem}
  .float-assist{bottom:14px;right:14px}
  .fb-logo-text{font-size:.95rem}
  .fb-logo-text small{font-size:.62rem}
  .wallet-text .amount{font-size:1.45rem}
  .empty-state-title{font-size:1.2rem}
  .empty-state-icon{width:90px;height:90px;font-size:2.4rem}
  .empty-state-actions{flex-direction:column;width:100%;max-width:320px}
  .empty-state-btn{width:100%;justify-content:center}
}
@media (max-width:380px){
  .fb-logo-mark{width:36px;height:36px;font-size:23px}
  .fb-logo-text{font-size:.88rem}
  .fb-logo-text small{font-size:.58rem}
  .fb-logo-text small i{display:none}
}
@media (hover:none){
  .video-overlay-actions{
    opacity:1;pointer-events:auto;
    background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.15) 55%,transparent);
    align-items:flex-end;padding-bottom:16px;
    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .action-pulse-btn{transform:translateY(0)}
  .video-card:hover{transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

function safeJSON(k,fb){

    return p&&typeof p==='object'?p:fb;
  }catch(e){return fb}
}

function showToast(html,type){
  type=type||'';
  const existing=document.querySelector('.mg-toast');
  if(existing)existing.remove();
  if(toastTimer)clearTimeout(toastTimer);
  const t=document.createElement('div');
  t.className='mg-toast '+type;
  t.innerHTML=html;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  toastTimer=setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>{if(t.parentNode)t.remove()},400);
  },3200);
}

/* ============ RIPPLE ============ */
document.addEventListener('click',function(e){
  const btn=e.target.closest('button, .chip, .hist-filter, .assist-btn, .empty-state-btn');
  if(!btn)return;
  const cs=getComputedStyle(btn);
  if(cs.position==='static')btn.style.position='relative';
  btn.style.overflow='hidden';
  const rect=btn.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  const ripple=document.createElement('span');
  ripple.className='ripple';
  ripple.style.width=ripple.style.height=size+'px';
  ripple.style.left=(e.clientX-rect.left-size/2)+'px';
  ripple.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(()=>ripple.remove(),700);
});

/* ============ FORMAT ============ */
const MONTHS_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function formatFullDate(ts){
  const d=new Date(ts);
  return {
    date:String(d.getDate()).padStart(2,'0')+' '+MONTHS_PT[d.getMonth()]+' '+d.getFullYear(),
    time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
  };
}
function calcAge(b){
  const t=new Date();let a=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0||(m===0&&t.getDate()<b.getDate()))a--;
  return a;
}
function formatCountdown(ms){
  if(ms<=0)return '00:00:00';
  const s=Math.floor(ms/1000);
  return String(Math.floor(s/3600)).padStart(2,'0')+':'+
         String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+
         String(s%60).padStart(2,'0');
}
function formatShortCountdown(ms){
  if(ms<=0)return 'Disponível';
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0)return h+'h '+m+'m';
  if(m>0)return m+'m '+sec+'s';
  return sec+'s';
}

  Object.keys(h).forEach(k=>{
    const it=h[k];
    if(it.status==='pending'&&it.type==='pending'&&(now-(it.createdAt||0))>=CLAIM_DELAY){

}

/* ============ HISTORY RENDER ============ */
const TYPE_STYLE={
  claimed:{cls:'status-claimed',label:'Recebido',icon:'fa-circle-check',color:'green'},
  pending:{cls:'status-pending',label:'Pendente',icon:'fa-hourglass-half',color:'orange'},
  cooldown:{cls:'status-cooldown',label:'Bloqueado',icon:'fa-lock',color:'gray'},
  blocked:{cls:'status-blocked',label:'Bloqueado',icon:'fa-ban',color:'purple'},
  withdraw:{cls:'status-withdraw',label:'Levantado',icon:'fa-hand-holding-dollar',color:'cyan'},
  info:{cls:'status-info',label:'Info',icon:'fa-circle-info',color:'cyan'}
};

function renderHistory(){
  const h=getHistory();
  const ids=Object.keys(h).sort((a,b)=>{
    const ta=h[a].claimedAt||h[a].createdAt||0;
    const tb=h[b].claimedAt||h[b].createdAt||0;
    return tb-ta;
  });
  const items=ids.map(id=>Object.assign({id},h[id]));

  const counts={all:items.length,claimed:0,pending:0,cooldown:0,blocked:0,withdraw:0};
  let pendingMT=0,blockedCount=0,totalEarned=0;
  items.forEach(it=>{
    const t=it.type||'info';
    if(counts[t]!==undefined)counts[t]++;
    if(t==='pending')pendingMT+=it.amount||0;
    if(t==='claimed')totalEarned+=it.amount||0;
    if(t==='cooldown'||t==='blocked')blockedCount++;
  });
  document.getElementById('sumClaimed').textContent=totalEarned.toFixed(2);
  document.getElementById('sumPending').textContent=pendingMT.toFixed(2);
  document.getElementById('sumFailed').textContent=blockedCount;
  document.getElementById('sumTotal').textContent=items.length;
  document.getElementById('filterAll').textContent=counts.all;
  document.getElementById('filterClaimed').textContent=counts.claimed;
  document.getElementById('filterPending').textContent=counts.pending;
  document.getElementById('filterCooldown').textContent=counts.cooldown+counts.blocked;
  document.getElementById('filterWithdraw').textContent=counts.withdraw;

  let filtered=items;
  if(currentFilter==='claimed')filtered=items.filter(i=>i.type==='claimed');
  else if(currentFilter==='pending')filtered=items.filter(i=>i.type==='pending');
  else if(currentFilter==='cooldown')filtered=items.filter(i=>i.type==='cooldown'||i.type==='blocked');
  else if(currentFilter==='withdraw')filtered=items.filter(i=>i.type==='withdraw');

  if(filtered.length===0){
    historyBody.innerHTML=
      '<div class="history-empty">'+
        '<i class="fas fa-inbox"></i>'+
        '<h4>Sem atividade</h4>'+
        '<p>Comece a interagir com os banners para ver o seu histórico aqui.</p>'+
      '</div>';
    return;
  }

  historyBody.innerHTML=filtered.map((it,idx)=>{
    const type=it.type||'info';
    const style=TYPE_STYLE[type]||TYPE_STYLE.info;
    const ts=it.claimedAt||it.createdAt||Date.now();
    const fmt=formatFullDate(ts);
    const isPending=(type==='pending');

    let title=it.title||'';
    if(type==='withdraw')title='Levantamento: '+(it.amount||0).toFixed(2)+' MT';
    if(type==='cooldown'&&!title)title='Banner em cooldown';
    if(type==='blocked'&&!title)title='Ação bloqueada';
    if(!title)title='Atividade';

    let valueHtml='';
    if(type==='claimed'||type==='pending'){
      valueHtml='<span class="value '+style.color+'">+'+(it.amount||0).toFixed(2)+' MT</span>';
    }else if(type==='withdraw'){
      valueHtml='<span class="value cyan">-'+(it.amount||0).toFixed(2)+' MT</span>';
    }else if(type==='cooldown'||type==='blocked'){
      valueHtml='<span class="value gray">Bloqueado</span>';
    }else{
      valueHtml='<span class="value cyan">Info</span>';
    }

    let countdownHtml='';
    if(isPending){
      const rem=Math.max(0,CLAIM_DELAY-(Date.now()-(it.createdAt||0)));
      countdownHtml='<div class="pending-timer" data-created="'+it.createdAt+'">'+
        '<i class="fas fa-clock"></i> Credita em <span class="timer-text">'+formatCountdown(rem)+'</span></div>';
    }

    const noteHtml=it.note?
      '<div class="history-item-meta" style="margin-top:4px"><span style="color:var(--fb-text-secondary);font-size:.68rem">'+esc(it.note)+'</span></div>':'';

    const stagger=Math.min(idx*0.04,0.4);

    return (
      '<div class="history-item" style="border-left:3px solid var(--'+style.color+'); animation-delay:'+stagger+'s">'+
        '<div class="history-item-icon"><i class="fab fa-'+(it.platform||'facebook')+'"></i></div>'+
        '<div class="history-item-content">'+
          '<div class="history-item-title">'+esc(title)+'</div>'+
          '<div class="history-item-meta">'+
            (it.channel?'<span>'+esc(it.channel)+'</span>':'')+
            '<span class="date-badge"><i class="fas fa-calendar"></i> '+fmt.date+'</span>'+
            '<span class="date-badge"><i class="fas fa-clock"></i> '+fmt.time+'</span>'+
          '</div>'+
          '<div class="history-item-amount">'+valueHtml+
            '<span class="history-item-status '+style.cls+'"><i class="fas '+style.icon+'"></i> '+style.label+'</span>'+
          '</div>'+
          noteHtml+countdownHtml+
        '</div>'+
      '</div>'
    );
  }).join('');
}

        '<div class="video-channel">'+esc(item.channel)+' <i class="fas fa-circle-check verified"></i></div>'+
      '</div>'+
    '</div>'

}

function buildEmptyStateHTML(){
  return (
    '<div class="empty-state-wrap">'+
      '<div class="empty-state-icon"><i class="fas fa-inbox"></i></div>'+
      '<h2 class="empty-state-title">Não existem tarefas disponíveis no momento</h2>'+

      '</p>'+

        '<button class="empty-state-btn primary" id="refreshTasksBtn">'+
          '<i class="fas fa-rotate-right"></i> Atualizar página'+
        '</button>'+
        '<button class="empty-state-btn secondary" id="openHistoryFromEmpty">'+
          '<i class="fas fa-clock-rotate-left"></i> Ver histórico'+
        '</button>'+

function renderVideos(filter){
  filter=filter||'all';
  videoGrid.innerHTML='';

  /* ---- ESTADO VAZIO: sem tarefas ---- */
  if(bannerData.length===0){
    videoGrid.style.display='block';
    videoGrid.innerHTML=buildEmptyStateHTML();
    bindEmptyStateEvents();
    return;
  }

  /* ---- GRID NORMAL ---- */
  videoGrid.style.display='grid';
  let visibleIndex=0;
  bannerData.forEach((item,index)=>{
    if(filter!=='all'&&item.platform!==filter)return;
    const card=document.createElement('div');
    card.className='video-card';
    card.setAttribute('data-index',index);
    card.setAttribute('data-platform',item.platform);
    card.style.animationDelay=Math.min(visibleIndex*0.05,0.6)+'s';
    card.innerHTML=buildCardHTML(item,index);
    videoGrid.appendChild(card);
    visibleIndex++;
  });

  /* Filtro sem resultados */
  if(visibleIndex===0){
    videoGrid.innerHTML=
      '<div class="empty-filter-result">'+
        '<i class="fas fa-filter-circle-xmark"></i>'+
        '<h4>Nada por aqui</h4>'+
        '<p>Nenhuma tarefa corresponde a este filtro.</p>'+
      '</div>';
    return;
  }

  attachCardEvents();
}

function bindEmptyStateEvents(){
  const refreshBtn=document.getElementById('refreshTasksBtn');
  const historyBtn=document.getElementById('openHistoryFromEmpty');
  if(refreshBtn){
    refreshBtn.addEventListener('click',function(){
      location.reload();
    });
  }
  if(historyBtn){
    historyBtn.addEventListener('click',function(){
      openHistory();
    });
  }
}

function refreshSingleCard(index){
  const card=document.querySelector('.video-card[data-index="'+index+'"]');
  if(!card)return;
  const item=bannerData[index];if(!item)return;
  const thumb=card.querySelector('.video-thumb');
  const info=card.querySelector('.video-info');
  if(!thumb||!info)return;
  const fresh=document.createElement('div');
  fresh.innerHTML=buildCardHTML(item,index);
  thumb.replaceWith(fresh.querySelector('.video-thumb'));
  info.replaceWith(fresh.querySelector('.video-info'));
  attachCardEvents();
}

function refreshAllCards(){
  document.querySelectorAll('.video-card').forEach(card=>{
    const idx=parseInt(card.getAttribute('data-index'),10);
    if(!isNaN(idx))refreshSingleCard(idx);
  });
}

function attachCardEvents(){
  videoGrid.querySelectorAll('.action-pulse-btn').forEach(btn=>{
    if(btn.dataset.bound==='1')return;
    btn.dataset.bound='1';
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      if(this.disabled)return;
      const idx=parseInt(this.getAttribute('data-action'),10);
      if(isNaN(idx))return;
      handleCardClick(idx,this.closest('.video-card'));
    });
  });
  videoGrid.querySelectorAll('.video-card').forEach(card=>{
    if(card.dataset.bound==='1')return;
    card.dataset.bound='1';
    card.addEventListener('click',function(e){
      if(e.target.closest('.action-pulse-btn'))return;
      const idx=parseInt(card.getAttribute('data-index'),10);
      if(isNaN(idx))return;
      handleCardClick(idx,card);
    });
  });
}

function openBannerLink(banner){
  if(!banner||!banner.link)return null;
  try{
    const w=window.open(banner.link,'_blank','noopener,noreferrer');
    if(!w){
      const a=document.createElement('a');
      a.href=banner.link;a.target='_blank';a.rel='noopener noreferrer';
      document.body.appendChild(a);a.click();a.remove();
    }
    return w;
  }catch(e){return null}
}

function handleCardClick(idx,cardEl){
  if(!cardEl)return;
  const item=bannerData[idx];if(!item)return;

  const rem=getCooldownRemaining(idx);
  if(rem>0){
    openBannerLink(item);
    if(!alreadyLoggedSinceCooldown(idx)){
      logActivity({type:'cooldown',title:item.title,channel:item.channel,
        bannerIndex:idx,platform:item.platform,
        note:'Disponível em '+formatShortCountdown(rem)});
    }
    if(historyPanel.classList.contains('open'))renderHistory();
    showToast('<i class="fas fa-lock"></i> Bloqueado. Disponível em '+formatShortCountdown(rem),'info');
    return;
  }

  const h=getHistory();
  let hasPending=false;
  Object.keys(h).forEach(k=>{
    const it=h[k];
    if(it.status==='pending'&&it.bannerIndex===idx&&it.type==='pending')hasPending=true;
  });
  if(hasPending){
    openBannerLink(item);
    if(!alreadyLoggedSinceCooldown(idx)){
      logActivity({type:'cooldown',title:item.title,channel:item.channel,
        bannerIndex:idx,platform:item.platform,note:'Recompensa em análise (aguarde 1h)'});
    }
    if(historyPanel.classList.contains('open'))renderHistory();
    showToast('<i class="fas fa-hourglass-half"></i> Recompensa em análise. Aguarde 1h.','pending');
    return;
  }

  if(cardEl.dataset.locked==='1')return;
  cardEl.dataset.locked='1';
  setTimeout(()=>{cardEl.dataset.locked='0'},2000);

  openBannerLink(item);

  const now=Date.now();
  const key='reward_'+idx+'_'+now;
  const fresh=getHistory();
  fresh[key]={
    type:'pending',status:'pending',amount:REWARD_AMOUNT,
    source:item.platform,platform:item.platform,
    title:item.title,channel:item.channel,bannerIndex:idx,
    createdAt:now,claimedAt:null,
    note:'Ganho registado • credita em 1h'
  };
  saveHistory(fresh);
  markBannerClicked(idx);
  updateWalletUI();
  updateBellBadge();
  refreshSingleCard(idx);
  if(historyPanel.classList.contains('open'))renderHistory();
  showToast('<i class="fas fa-circle-check"></i> +'+REWARD_AMOUNT.toFixed(2)+' MT! Creditado em 1h.','success');
}

/* Limita data de nascimento ao mínimo de idade */
(function(){
  const bd=document.getElementById('birthDate');
  const max=new Date();
  max.setFullYear(max.getFullYear()-MIN_AGE);
  bd.max=max.toISOString().slice(0,10);
})();

withdrawForm.addEventListener('submit',function(e){
  e.preventDefault();
  const fbName=document.getElementById('fbName').value.trim();
  const province=provinceSelect.value;
  const district=districtSelect.value;
  const birthDate=document.getElementById('birthDate').value;

  if(!fbName){showToast('<i class="fas fa-circle-exclamation"></i> Insira o nome do Facebook','error');return}
  if(!province){showToast('<i class="fas fa-circle-exclamation"></i> Selecione a província','error');return}
  if(!district){showToast('<i class="fas fa-circle-exclamation"></i> Selecione o distrito','error');return}
  if(!birthDate){showToast('<i class="fas fa-circle-exclamation"></i> Selecione a data de nascimento','error');return}

  const birth=new Date(birthDate);
  if(isNaN(birth.getTime())){showToast('<i class="fas fa-circle-exclamation"></i> Data inválida','error');return}
  const age=calcAge(birth);
  if(age<MIN_AGE){
    logActivity({type:'blocked',title:'Levantamento bloqueado',note:'Idade insuficiente ('+age+' anos). Mínimo '+MIN_AGE});
    if(historyPanel.classList.contains('open'))renderHistory();
    showToast('<i class="fas fa-circle-exclamation"></i> Deve ter pelo menos '+MIN_AGE+' anos','error');
    return;
  }

  const amountToWithdraw=parseFloat(balance.toFixed(2));
  const formattedDate=birth.toLocaleDateString('pt-MZ');
  const msg='🟦 *LEVANTAMENTO MILLER MONETIZAÇÃO* 🟦\n\n'+
    '👤 *Nome Facebook:* '+fbName+'\n'+
    '📍 *Província:* '+province+'\n'+
    '🏙️ *Distrito:* '+district+'\n'+
    '📅 *Data de Nascimento:* '+formattedDate+'\n'+
    '🎂 *Idade:* '+age+' anos\n'+
    '💰 *Valor a Levantar:* '+amountToWithdraw.toFixed(2)+' MT\n\n'+
    '✅ Pedido de levantamento enviado com sucesso!';
  const waUrl='https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent(msg);

  balance-=amountToWithdraw;
  if(balance<0)balance=0;
  saveBalance();
  updateWalletUI(true);
  logActivity({type:'withdraw',amount:amountToWithdraw,
    title:'Levantamento para '+fbName,channel:province+' / '+district,
    note:'Idade: '+age+' anos • Enviado via WhatsApp'});
  if(historyPanel.classList.contains('open'))renderHistory();

  const win=window.open(waUrl,'_blank','noopener,noreferrer');
  if(!win||win.closed||typeof win.closed==='undefined')window.location.href=waUrl;

  closeModal();
  showToast('<i class="fas fa-circle-check"></i> Levantamento de '+amountToWithdraw.toFixed(2)+' MT enviado!','success');
  console.log('%c💸 Levantamento: -'+amountToWithdraw.toFixed(2)+' MT | Novo saldo: '+balance.toFixed(2)+' MT',
    'color:#1877f2;font-weight:bold;');
});

/* ============ TIMERS ============ */
setInterval(function(){
  document.querySelectorAll('.pending-timer').forEach(el=>{
    const created=parseInt(el.getAttribute('data-created'),10);
    if(!created)return;
    const rem=Math.max(0,CLAIM_DELAY-(Date.now()-created));
    const txt=el.querySelector('.timer-text');
    if(txt)txt.textContent=formatCountdown(rem);
  });
  document.querySelectorAll('.reward-tag.cooldown').forEach(el=>{
    const idx=parseInt(el.getAttribute('data-cooldown-index'),10);
    if(isNaN(idx))return;
    const rem=getCooldownRemaining(idx);
    const span=el.querySelector('.cooldown-text');
    if(rem<=0){
      refreshSingleCard(idx);
      if(historyPanel.classList.contains('open'))renderHistory();
    }else if(span){
      span.textContent=formatShortCountdown(rem);
    }
  });
  const now=Date.now();
  if(now-lastPendingCheck>=5000){
    lastPendingCheck=now;
    if(processPendingRewards(true)){
      refreshAllCards();
      if(historyPanel.classList.contains('open'))renderHistory();
    }
  }
},1000);

document.addEventListener('visibilitychange',function(){
  if(!document.hidden){
    if(processPendingRewards(true)){
      refreshAllCards();
      if(historyPanel.classList.contains('open'))renderHistory();
    }
  }
});
